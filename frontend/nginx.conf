server {
    listen 80;
    root /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy al backend (capa de aplicación). La carga inicial de la base
    # supera el límite de 1 MB que nginx trae por defecto.
    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
