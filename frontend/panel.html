<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel | Sistema de Evaluación por Competencias y Desempeño</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="css/panel.css">
</head>

<body>

<div class="shell">

  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <nav class="sidebar" aria-label="Navegación del sistema">

    <div class="sidebar__brand">
      <div class="sidebar__mark" aria-hidden="true">TH</div>
      <div class="sidebar__brand-text">
        <strong>Talento Humano</strong>
        <span>Evaluación por competencias</span>
      </div>
    </div>

    <div class="sidebar__profile" id="sidebarProfile"></div>

    <div id="sidebarNav"></div>

    <div class="sidebar__spacer"></div>

    <button type="button" class="sidebar__logout" id="logoutBtn">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Salir
    </button>

  </nav>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main class="main">

    <div class="topline">

      <div class="topline__title">
        <p class="eyebrow" id="topTitleEyebrow"></p>
        <h1 id="topTitleH1"></h1>
        <p id="topTitleP"></p>
      </div>

      <div class="topline__actions">
        <button type="button" class="bell-btn" id="bellBtn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bell-btn__dot" id="bellDot" hidden></span>
        </button>
      </div>

    </div>

    <div id="viewRoot"></div>

  </main>

</div>


<!-- =========================================================
     MODAL GENÉRICO (reutilizado por todos los módulos)
========================================================= -->

<div class="modal-overlay" id="modalOverlay" hidden aria-hidden="true">
  <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="js/data/competencias.js?v=3"></script>
<script src="js/data/logo.js?v=3"></script>
<script src="js/pdf-plantilla.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/ui.js?v=3"></script>

<script src="js/modules/dashboard.js?v=3"></script>
<script src="js/modules/miperfil.js?v=3"></script>
<script src="js/modules/notificaciones.js?v=3"></script>
<script src="js/modules/usuarios.js?v=3"></script>
<script src="js/modules/roles.js?v=3"></script>
<script src="js/modules/perfiles.js?v=3"></script>
<script src="js/modules/competencias.js?v=3"></script>
<script src="js/modules/comportamientos.js?v=3"></script>
<script src="js/modules/periodos.js?v=3"></script>
<script src="js/modules/evaluadores.js?v=3"></script>
<script src="js/modules/evaluaciones.js?v=3"></script>
<script src="js/modules/resultados.js?v=3"></script>
<script src="js/modules/seguimiento.js?v=3"></script>
<script src="js/modules/informes.js?v=3"></script>
<script src="js/modules/busqueda.js?v=3"></script>
<script src="js/modules/ia.js?v=3"></script>
<script src="js/modules/desempeno.js?v=3"></script>

<script src="js/panel.js?v=3"></script>

</body>
</html>
