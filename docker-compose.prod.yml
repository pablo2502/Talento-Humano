services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-talentodb}
      MYSQL_USER: ${DB_USER:-talento}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talento123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    image: ${DOCKERHUB_USER:?Define DOCKERHUB_USER en .env}/talento-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-talentodb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      DB_USER: ${DB_USER:-talento}
      DB_PASSWORD: ${DB_PASSWORD:-talento123}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USER}/talento-frontend:latest
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-8090}:80"]
    depends_on: [backend]

volumes:
  mysql_data:
